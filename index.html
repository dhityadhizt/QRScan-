<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Scanner & Reader</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library HTML5-QRCode -->
  <script src="https://unpkg.com/html5-qrcode" crossorigin="anonymous"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl shadow-2xl overflow-hidden p-6 text-white">
    
    <!-- Header -->
    <div class="text-center mb-5">
      <h1 class="text-2xl font-bold tracking-wide">QR Scanner</h1>
      <p class="text-xs text-slate-300 mt-1">Scan langsung via kamera atau upload dari galeri</p>
    </div>

    <!-- Tab Navigation -->
    <div class="flex bg-slate-800/60 p-1 rounded-xl mb-5 border border-white/10">
      <button id="tab-camera" onclick="switchTab('camera')" class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all bg-indigo-600 text-white shadow-lg flex items-center justify-center space-x-1.5">
        <span>📷</span> <span>Kamera</span>
      </button>
      <button id="tab-gallery" onclick="switchTab('gallery')" class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-white flex items-center justify-center space-x-1.5">
        <span>📁</span> <span>Galeri</span>
      </button>
    </div>

    <!-- Section Kamera -->
    <div id="section-camera" class="space-y-3">
      <!-- Area Kamera -->
      <div class="relative w-full overflow-hidden rounded-xl bg-black border border-white/10 min-h-[260px] flex items-center justify-center">
        <div id="reader" class="w-full"></div>
      </div>

      <!-- Kontrol Kamera (Tombol Switch Kamera & Status) -->
      <div class="flex items-center justify-between bg-white/5 px-4 py-2.5 rounded-xl border border-white/10">
        <span id="camera-status" class="text-xs text-indigo-300 font-medium">Kamera Belakang Aktif</span>
        <button onclick="toggleCameraPosition()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg shadow transition flex items-center space-x-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          <span>Putar Kamera</span>
        </button>
      </div>
    </div>

    <!-- Section Galeri (Hidden by default) -->
    <div id="section-gallery" class="hidden space-y-3">
      <label for="qr-file" class="flex flex-col items-center justify-center w-full h-52 border-2 border-dashed border-white/30 rounded-xl cursor-pointer bg-white/5 hover:bg-white/10 transition">
        <div class="flex flex-col items-center justify-center pt-5 pb-6 px-4 text-center">
          <svg class="w-10 h-10 mb-2 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
          <p class="mb-1 text-sm text-slate-200"><span class="font-semibold">Klik untuk upload foto QR</span></p>
          <p class="text-xs text-slate-400">Mendukung format PNG, JPG, WEBP</p>
        </div>
        <input type="file" id="qr-file" accept="image/*" class="hidden" />
      </label>
    </div>

    <!-- Result Box (Hidden until scanned) -->
    <div id="result-container" class="hidden mt-5 p-4 bg-emerald-950/80 border border-emerald-500/30 rounded-xl animate-fade-in">
      <div class="flex items-center space-x-2 mb-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
        <h3 class="text-xs font-semibold text-emerald-300 uppercase tracking-wider">Berhasil Mendeteksi QR!</h3>
      </div>
      
      <!-- Link Teks -->
      <div class="bg-black/30 p-2.5 rounded-lg mb-3 break-all">
        <a id="result-link" href="#" target="_blank" class="text-indigo-400 hover:text-indigo-300 text-xs font-medium underline"></a>
      </div>

      <!-- Tombol Aksi Buka Link -->
      <button id="btn-redirect" class="w-full py-2.5 px-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white text-sm font-semibold rounded-xl shadow-lg transition transform active:scale-95 flex items-center justify-center space-x-2">
        <span>Buka Tautan Otomatis</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
      </button>
    </div>

  </div>

  <script>
    const tabCamera = document.getElementById('tab-camera');
    const tabGallery = document.getElementById('tab-gallery');
    const sectionCamera = document.getElementById('section-camera');
    const sectionGallery = document.getElementById('section-gallery');
    
    const resultContainer = document.getElementById('result-container');
    const resultLink = document.getElementById('result-link');
    const btnRedirect = document.getElementById('btn-redirect');
    const fileInput = document.getElementById('qr-file');
    const cameraStatus = document.getElementById('camera-status');

    let html5QrCode = null;
    let useFrontCamera = false; // Default: kamera belakang (environment)
    let isCameraRunning = false;

    // Fungsi Navigasi Tab
    function switchTab(tab) {
      if (tab === 'camera') {
        tabCamera.className = "flex-1 py-2 text-xs font-semibold rounded-lg transition-all bg-indigo-600 text-white shadow-lg flex items-center justify-center space-x-1.5";
        tabGallery.className = "flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-white flex items-center justify-center space-x-1.5";
        sectionCamera.classList.remove('hidden');
        sectionGallery.classList.add('hidden');
        startCamera();
      } else {
        tabGallery.className = "flex-1 py-2 text-xs font-semibold rounded-lg transition-all bg-indigo-600 text-white shadow-lg flex items-center justify-center space-x-1.5";
        tabCamera.className = "flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-white flex items-center justify-center space-x-1.5";
        sectionGallery.classList.remove('hidden');
        sectionCamera.classList.add('hidden');
        stopCamera();
      }
    }

    // Handle Hasil Scan
    function handleScanResult(decodedText) {
      resultContainer.classList.remove('hidden');
      
      let formattedUrl = decodedText;
      if (!/^https?:\/\//i.test(formattedUrl)) {
        formattedUrl = 'https://' + formattedUrl;
      }

      resultLink.innerText = decodedText;
      resultLink.href = formattedUrl;
      
      btnRedirect.onclick = function() {
        window.open(formattedUrl, '_blank');
      };
    }

    // Inisialisasi & Start Kamera
    function startCamera() {
      if (isCameraRunning) return;

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      const facingModeConfig = useFrontCamera ? "user" : "environment";
      cameraStatus.innerText = useFrontCamera ? "Kamera Depan Aktif" : "Kamera Belakang Aktif";

      html5QrCode.start(
        { facingMode: facingModeConfig },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        (decodedText) => {
          handleScanResult(decodedText);
        },
        (errorMessage) => {
          // Abaikan error frame kosong
        }
      ).then(() => {
        isCameraRunning = true;
      }).catch(err => {
        console.error("Gagal membuka kamera:", err);
        cameraStatus.innerText = "Izin kamera ditolak / tidak tersedia";
      });
    }

    // Stop Kamera
    function stopCamera() {
      if (html5QrCode && isCameraRunning) {
        html5QrCode.stop().then(() => {
          isCameraRunning = false;
        }).catch(err => {
          console.error("Gagal mematikan kamera:", err);
        });
      }
    }

    // Tombol Toggle Kamera Depan/Belakang
    function toggleCameraPosition() {
      useFrontCamera = !useFrontCamera;
      if (isCameraRunning) {
        html5QrCode.stop().then(() => {
          isCameraRunning = false;
          startCamera();
        }).catch(err => {
          console.error("Gagal switch kamera:", err);
        });
      } else {
        startCamera();
      }
    }

    // Event Listener Upload File Galeri
    fileInput.addEventListener('change', e => {
      if (e.target.files.length === 0) return;
      const imageFile = e.target.files[0];
      
      stopCamera();

      const scannerFile = new Html5Qrcode("reader");
      scannerFile.scanFile(imageFile, true)
        .then(decodedText => {
          handleScanResult(decodedText);
          scannerFile.clear();
        })
        .catch(err => {
          alert("QR Code tidak ditemukan pada gambar. Pastikan gambar jelas.");
        });
    });

    // Jalankan kamera saat halaman pertama kali dimuat
    window.addEventListener('DOMContentLoaded', () => {
      startCamera();
    });
  </script>
</body>
</html>
