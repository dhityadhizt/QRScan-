<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Scanner</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library HTML5-QRCode -->
  <script src="https://unpkg.com/html5-qrcode" crossorigin="anonymous"></script>
  <style>
    /* Menyembunyikan teks/elemen bawaan library yang membuat berantakan */
    #reader__dashboard_section_csr button, 
    #reader__dashboard_section_swaplink {
      background-color: #4f46e5 !important;
      color: white !important;
      padding: 8px 16px !important;
      border-radius: 8px !important;
      border: none !important;
      font-weight: 600 !important;
      cursor: pointer !important;
      margin-top: 8px !important;
    }
    #reader img { display: none; } /* Sembunyikan icon bawaan */
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl shadow-2xl p-6 text-white">
    
    <!-- Header Simpel -->
    <div class="text-center mb-5">
      <h1 class="text-xl font-bold tracking-wide">Scan QR Code</h1>
      <p class="text-xs text-slate-300 mt-1">Arahkan kamera ke QR atau pilih foto dari galeri</p>
    </div>

    <!-- Pilihan Menu (Tab Simpel) -->
    <div class="flex bg-slate-800/80 p-1 rounded-xl mb-5 border border-white/10">
      <button id="btn-mode-camera" onclick="switchMode('camera')" class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all bg-indigo-600 text-white shadow">
        📷 Kamera
      </button>
      <button id="btn-mode-gallery" onclick="switchMode('gallery')" class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-white">
        📁 Upload Galeri
      </button>
    </div>

    <!-- Area Kamera -->
    <div id="box-camera" class="space-y-3">
      <div id="reader" class="w-full overflow-hidden rounded-xl bg-slate-950/60 border border-white/10 text-center"></div>
      <p class="text-[11px] text-center text-slate-400">Pastikan memberi izin akses kamera pada browser Anda.</p>
    </div>

    <!-- Area Upload Galeri (Hidden by default) -->
    <div id="box-gallery" class="hidden space-y-3">
      <label for="qr-file-input" class="flex flex-col items-center justify-center w-full h-44 border-2 border-dashed border-white/30 rounded-xl cursor-pointer bg-white/5 hover:bg-white/10 transition">
        <div class="flex flex-col items-center justify-center pt-4 pb-5 px-4 text-center">
          <svg class="w-8 h-8 mb-2 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          <p class="text-xs text-slate-200 font-medium">Klik untuk pilih gambar QR dari galeri</p>
        </div>
        <input type="file" id="qr-file-input" accept="image/*" class="hidden" />
      </label>
    </div>

    <!-- Kotak Hasil Scan (Muncul Otomatis) -->
    <div id="result-box" class="hidden mt-5 p-4 bg-emerald-950/90 border border-emerald-500/40 rounded-xl">
      <div class="flex items-center space-x-2 mb-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        <h3 class="text-xs font-bold text-emerald-300 uppercase tracking-wider">Hasil QR Code:</h3>
      </div>
      
      <div class="bg-black/40 p-2.5 rounded-lg mb-3 break-all">
        <a id="result-link" href="#" target="_blank" class="text-indigo-400 hover:text-indigo-300 text-xs font-medium underline"></a>
      </div>

      <button id="btn-open-link" class="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-lg shadow transition flex items-center justify-center space-x-1.5">
        <span>Buka Tautan Otomatis</span>
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
      </button>
    </div>

  </div>

  <script>
    const btnModeCamera = document.getElementById('btn-mode-camera');
    const btnModeGallery = document.getElementById('btn-mode-gallery');
    const boxCamera = document.getElementById('box-camera');
    const boxGallery = document.getElementById('box-gallery');
    
    const resultBox = document.getElementById('result-box');
    const resultLink = document.getElementById('result-link');
    const btnOpenLink = document.getElementById('btn-open-link');
    const fileInput = document.getElementById('qr-file-input');

    let html5QrcodeScanner = null;
    let cameraActive = false;

    function switchMode(mode) {
      if (mode === 'camera') {
        btnModeCamera.className = "flex-1 py-2 text-xs font-semibold rounded-lg transition-all bg-indigo-600 text-white shadow";
        btnModeGallery.className = "flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-white";
        boxCamera.classList.remove('hidden');
        boxGallery.classList.add('hidden');
        startCamera();
      } else {
        btnModeGallery.className = "flex-1 py-2 text-xs font-semibold rounded-lg transition-all bg-indigo-600 text-white shadow";
        btnModeCamera.className = "flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-white";
        boxGallery.classList.remove('hidden');
        boxCamera.classList.add('hidden');
        stopCamera();
      }
    }

    function handleSuccess(text) {
      resultBox.classList.remove('hidden');
      let url = text;
      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
      }
      resultLink.innerText = text;
      resultLink.href = url;
      btnOpenLink.onclick = () => window.open(url, '_blank');
    }

    function startCamera() {
      if (cameraActive) return;
      try {
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 200, height: 200 } }, false);
        html5QrcodeScanner.render(handleSuccess, () => {});
        cameraActive = true;
      } catch (e) {
        console.error(e);
      }
    }

    function stopCamera() {
      if (html5QrcodeScanner && cameraActive) {
        html5QrcodeScanner.clear().catch(() => {});
        cameraActive = false;
      }
    }

    fileInput.addEventListener('change', e => {
      if (e.target.files.length === 0) return;
      const file = e.target.files[0];
      const qrReaderFile = new Html5Qrcode("reader");
      qrReaderFile.scanFile(file, true)
        .then(text => {
          handleSuccess(text);
          qrReaderFile
