<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Scanner & Reader</title>
  <script src="https://unpkg.com/html5-qrcode" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .container { background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 480px; text-align: center; }
    h2 { margin-top: 0; color: #333; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 20px; background: #000; min-height: 250px; }
    .upload-section { margin: 15px 0; padding: 15px; border: 2px dashed #ccc; border-radius: 8px; background: #fafafa; }
    input[type="file"] { display: none; }
    .custom-file-upload { display: inline-block; padding: 10px 20px; cursor: pointer; background-color: #4A90E2; color: white; border-radius: 6px; font-weight: bold; }
    .result-box { margin-top: 20px; padding: 15px; border-radius: 8px; background-color: #eef7ee; border: 1px solid #c3e6cb; display: none; word-break: break-all; text-align: left; }
    .result-link { font-size: 16px; color: #0066cc; text-decoration: underline; display: inline-block; margin-bottom: 15px; word-break: break-all; }
    .btn-open { display: inline-block; width: 100%; padding: 12px; background-color: #28a745; color: white; text-decoration: none; font-size: 16px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <h2>Scanner QR Code</h2>

  <!-- Area Kamera -->
  <div id="reader"></div>

  <!-- Upload dari Galeri -->
  <div class="upload-section">
    <label for="qr-input-file" class="custom-file-upload">
      📁 Upload QR dari Galeri
    </label>
    <input type="file" id="qr-input-file" accept="image/*">
  </div>

  <!-- Hasil Scan -->
  <div id="result-container" class="result-box">
    <h3 style="margin-top:0; color:#155724;">Hasil Scan:</h3>
    <a id="result-link" class="result-link" href="#" target="_blank"></a>
    <button id="btn-redirect" class="btn-open">Buka Link</button>
  </div>
</div>

<script>
  const resultContainer = document.getElementById('result-container');
  const resultLink = document.getElementById('result-link');
  const btnRedirect = document.getElementById('btn-redirect');
  const fileInput = document.getElementById('qr-input-file');

  function handleScanResult(decodedText) {
    resultContainer.style.display = 'block';
    let formattedUrl = decodedText;
    if (!/^https?:\/\//i.test(formattedUrl)) {
      formattedUrl = 'https://' + formattedUrl;
    }
    resultLink.innerText = decodedText;
    resultLink.href = formattedUrl;
    btnRedirect.onclick = function() {
      window.open(formattedUrl, '_blank');
    };
  }

  // Inisialisasi Kamera Scanner
  const html5QrcodeScanner = new Html5QrcodeScanner(
    "reader", 
    { fps: 10, qrbox: { width: 250, height: 250 } }, 
    false
  );
  html5QrcodeScanner.render(handleScanResult, (err) => {});

  // Inisialisasi Upload File dari Galeri (Terpisah)
  fileInput.addEventListener('change', e => {
    if (e.target.files.length === 0) return;
    const imageFile = e.target.files[0];
    
    const html5QrCodeFile = new Html5Qrcode("reader");
    html5QrCodeFile.scanFile(imageFile, true)
      .then(decodedText => {
        handleScanResult(decodedText);
        html5QrCodeFile.clear();
      })
      .catch(err => {
        alert("Gagal membaca QR Code dari gambar. Pastikan gambar jelas!");
      });
  });
</script>

</body>
</html>
