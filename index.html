<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Scanner & Reader</title>
  <!-- Library HTML5-QRCode via CDN -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      text-align: center;
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    #reader {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .upload-section {
      margin: 15px 0;
      padding: 15px;
      border: 2px dashed #ccc;
      border-radius: 8px;
      background: #fafafa;
    }
    input[type="file"] {
      display: none;
    }
    .custom-file-upload {
      display: inline-block;
      padding: 10px 20px;
      cursor: pointer;
      background-color: #4A90E2;
      color: white;
      border-radius: 6px;
      font-weight: bold;
      transition: background 0.3s;
    }
    .custom-file-upload:hover {
      background-color: #357ABD;
    }
    .result-box {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background-color: #eef7ee;
      border: 1px solid #c3e6cb;
      display: none;
      word-break: break-all;
    }
    .result-box h3 {
      margin-top: 0;
      color: #155724;
    }
    .result-link {
      font-size: 16px;
      color: #0066cc;
      text-decoration: underline;
      display: inline-block;
      margin-bottom: 15px;
    }
