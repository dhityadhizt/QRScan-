<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner & Reader</title>
  <!-- Tailwind CSS untuk Desain Modern -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library HTML5-QRCode -->
  <script src="https://unpkg.com/html5-qrcode" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
    
    <!-- Header -->
    <div class="text-center space-y-1">
      <h1 class="text-xl font-bold tracking-tight text-white">QR Code Scanner</h1>
      <p class="text-xs text-slate-400">Arahkan kamera atau pilih gambar dari galeri</p>
    </div>

    <!-- Area Kamera & Viewport -->
    <div class="relative w-full aspect-square bg-slate-950 rounded-2xl overflow-hidden border border-slate-800 flex items-center justify-center">
      <div id="reader" class="w-full h-full"></div>
      
      <!-- Placeholder saat kamera mati -->
      <div id="camera-placeholder" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center bg-slate-950/95 z-10 transition-opacity">
        <svg class="w-12 h-12 text-indigo-500 mb-3 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <p class="text-sm font-medium text-slate-200">Kamera Belum Aktif</p>
        <p class="text-xs text-slate-400 mt-1">Tekan tombol di bawah untuk mulai memindai</p>
      </div>
    </div>

    <!-- Tombol Aksi (Kamera & Galeri) -->
    <div class="grid grid-cols-2 gap-3">
      <button id="btn-toggle-camera" onclick="toggleCamera()" class="py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs sm:text-sm rounded-xl transition shadow-lg shadow-indigo-600/20 flex items-center justify-center space-x-2">
        <span>📷 <span id="camera-btn-text">Nyalakan Kamera</span></span>
      </button>
      
      <label class="py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium text-xs sm:text-sm rounded-xl transition cursor-pointer text-center flex items-center justify-center space-x-2 border border-slate-700">
        <span>📁 Upload Galeri</span>
        <input type="file" id="qr-file" accept="image/*" class="hidden">
      </label>
    </div>

    <!-- Kotak Hasil Scan (Muncul otomatis saat QR terbaca) -->
    <div id="result-container" class="hidden p-4 bg-emerald-950/40 border border-emerald-500/30 rounded-2xl space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Hasil Berhasil Dipindai</span>
        <button onclick="resetResult()" class="text-xs text-slate-400 hover:text-white">Tutup</button>
      </div>
      
      <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 break-all">
        <a id="result-link" href="#" target="_blank" class="text-indigo-400 hover:underline text-sm font-medium"></a>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <button onclick="copyResult()" class="py-2.5 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl transition text-center">
          Salin Teks
        </button>
        <a id="btn-redirect" href="#" target="_blank" class="py-2.5 px-3 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-xl transition text-center flex items-center justify-center">
          Buka Tautan ↗
        </a>
      </div>
    </div>

  </div>

  <script>
    let html5QrCode = null;
    let isCameraRunning = false;

    const cameraPlaceholder = document.getElementById('camera-placeholder');
    const cameraBtnText = document.getElementById('camera-btn-text');
    const resultContainer = document.getElementById('result-container');
    const resultLink = document.getElementById('result-link');
    const btnRedirect = document.getElementById('btn-redirect');
    const fileInput = document.getElementById('qr-file');

    function onScanSuccess(decodedText) {
      resultContainer.classList.remove('hidden');
      
      let formattedUrl = decodedText;
      if (!/^https?:\/\//i.test(formattedUrl)) {
        formattedUrl = 'https://' + formattedUrl;
      }

      resultLink.innerText = decodedText;
      resultLink.href = formattedUrl;
      btnRedirect.href = formattedUrl;

      // Matikan kamera otomatis setelah berhasil scan agar praktis
      if (isCameraRunning) {
        toggleCamera();
      }
    }

    async function toggleCamera() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      if (isCameraRunning) {
        try {
          await html5QrCode.stop();
          isCameraRunning = false;
          cameraPlaceholder.style.opacity = '1';
          cameraPlaceholder.style.pointerEvents = 'auto';
          cameraBtnText.innerText = "Nyalakan Kamera";
        } catch (err) {
          console.error("Gagal menghentikan kamera", err);
        }
      } else {
        cameraPlaceholder.style.opacity = '0';
        cameraPlaceholder.style.pointerEvents = 'none';
        try {
          await html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 220, height: 220 } },
            onScanSuccess,
            (errorMessage) => {}
          );
          isCameraRunning = true;
          cameraBtnText.innerText = "Matikan Kamera";
        } catch (err) {
          cameraPlaceholder.style.opacity = '1';
          cameraPlaceholder.style.pointerEvents = 'auto';
          alert("Tidak dapat mengakses kamera. Pastikan izin kamera telah diberikan di browser.");
          console.error(err);
        }
      }
    }

    // Fitur Upload Galeri
    fileInput.addEventListener('change', e => {
      if (e.target.files.length === 0) return;
      const imageFile = e.target.files[0];

      if (isCameraRunning) {
        toggleCamera();
      }

      const fileScanner = new Html5Qrcode("reader");
      fileScanner.scanFile(imageFile, true)
        .then(decodedText => {
          onScanSuccess(decodedText);
          fileScanner.clear();
        })
        .catch(err => {
          alert("Gagal membaca QR code dari gambar tersebut. Pastikan gambar jelas dan memiliki QR code.");
        });
    });

    function resetResult() {
      resultContainer.classList.add('hidden');
    }

    function copyResult() {
      navigator.clipboard.writeText(resultLink.href);
      alert("Tautan berhasil disalin!");
    }
  </script>
</body>
</html>
